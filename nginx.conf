# ── Main site ──
# Serves on BOTH 80 and 443 during the CDN cutover so neither
# "Flexible" (CDN→origin :80) nor "Full (strict)" (CDN→origin :443)
# breaks. Once the CDN is confirmed on Full (strict), the :80 listener
# can be swapped for a 301 redirect (see commented block at the bottom).
server {
    listen 80;
    listen 443 ssl;
    server_name bublikstudios.net;

    # ── TLS (CDN → origin leg) ──
    # NOTE: this is leaf cert + CA bundle joined into one file (built on the
    # server, see command below) — NOT the raw bublikstudios_net.crt, which is
    # leaf-only and would fail the CDN's Full (strict) chain check. Build it:
    #   cat bublikstudios_net.crt bublikstudios_net.ca-bundle \
    #     | sudo tee /etc/nginx/certs/bublikstudios.net.chained.crt > /dev/null
    ssl_certificate     /etc/nginx/certs/bublikstudios.net.chained.crt;
    ssl_certificate_key /etc/nginx/certs/bublikstudios.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # AI Chat (SSE streaming) - must be before /api/
    location /api/chat {
        proxy_pass         http://127.0.0.1:8080/api/chat;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # API - Spring Boot on port 8080
    location /api/ {
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vault UI
    location /vault/ {
        proxy_pass         http://127.0.0.1:8200/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }


    # Grafana (sub-path)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3100/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Frontend - nginx on port 3000
    location / {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # LockIn Bot - SMS/Voice webhooks
    location /sms {
        proxy_pass         http://127.0.0.1:5000/sms;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /voice {
        proxy_pass         http://127.0.0.1:5000/voice;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://127.0.0.1:5000/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }


location /telegram {
        proxy_pass         http://127.0.0.1:5000/telegram;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

}

# ── After the CDN is confirmed on Full (strict), replace the `listen 80;`
#    line above with this redirect server to force all plain HTTP to HTTPS.
#    Do NOT enable this while the CDN is still on "Flexible" — it will cause
#    a redirect loop (CDN talks HTTP to origin, origin 301s to HTTPS, repeat).
#
# server {
#     listen 80;
#     server_name bublikstudios.net;
#     return 301 https://$host$request_uri;
# }


