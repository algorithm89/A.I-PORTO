# ── DDoS / abuse mitigation (L7 only) ──
# These live in the http{} context (this file is included inside http{}).
# NOTE: nginx handles application-layer floods, slowloris and brute-force.
# It CANNOT stop large volumetric (L3/L4) attacks — those saturate the link
# before nginx runs. For that you need an upstream scrubber (e.g. Cloudflare).
#
# Rate zones keyed by client IP. 10m of memory ≈ 160k IPs tracked.
limit_req_zone  $binary_remote_addr zone=req_general:10m rate=30r/s;  # normal browsing
limit_req_zone  $binary_remote_addr zone=req_login:10m   rate=10r/m;  # login brute-force
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;              # concurrent conns
limit_req_status  429;   # return "Too Many Requests" instead of 503
limit_conn_status 429;

# ── Main site ──
# Serves on BOTH 80 and 443 during the CDN cutover so neither
# "Flexible" (CDN→origin :80) nor "Full (strict)" (CDN→origin :443)
# breaks. Once the CDN is confirmed on Full (strict), the :80 listener
# can be swapped for a 301 redirect (see commented block at the bottom).
server {
    listen 80;
    listen 443 ssl;
    server_name bublikstudios.net;

    # ── TLS (CDN → origin leg) ──
    # bublikstudios.crt = leaf + CA bundle joined (build command below)
    ssl_certificate     /etc/nginx/certs/bublikstudios.net.crt;
    ssl_certificate_key /etc/nginx/certs/bublikstudios.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Abuse limits (apply to the whole server) ──
    limit_conn conn_perip 20;      # max 20 simultaneous connections per IP
    client_max_body_size 25m;      # reject oversized uploads
    client_body_timeout   10s;     # slowloris: drop slow request bodies
    client_header_timeout 10s;     # slowloris: drop slow headers
    send_timeout          10s;     # drop clients that stop reading the response
    keepalive_timeout     30s;

    # AI Chat (SSE streaming) - must be before /api/
    location /api/chat {
        proxy_pass         http://127.0.0.1:8080/api/chat;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        '';
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # Login endpoint — strict brute-force limit (burst allows a couple retries).
    # Adjust the path if your login route differs (e.g. /api/login).
    location = /api/auth/login {
        limit_req zone=req_login burst=5 nodelay;
        proxy_pass         http://127.0.0.1:8080/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # API - Spring Boot on port 8080
    location /api/ {
        limit_req zone=req_general burst=40 nodelay;
        proxy_pass         http://127.0.0.1:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Vault UI
    location /vault/ {
        proxy_pass         http://127.0.0.1:8200/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }


    # Grafana (sub-path)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass         http://127.0.0.1:3100/grafana/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Frontend - nginx on port 3000
    location / {
        limit_req zone=req_general burst=60 nodelay;
        proxy_pass         http://127.0.0.1:3000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # LockIn Bot - SMS/Voice webhooks
    location /sms {
        proxy_pass         http://127.0.0.1:5000/sms;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /voice {
        proxy_pass         http://127.0.0.1:5000/voice;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass         http://127.0.0.1:5000/health;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }


location /telegram {
        proxy_pass         http://127.0.0.1:5000/telegram;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

}

# ── cocarry.net (second site on this server, app on :3001) ──
server {
    listen 80;
    listen 443 ssl;
    server_name cocarry.net www.cocarry.net;

    ssl_certificate     /etc/nginx/certs/cocarry.net.crt;
    ssl_certificate_key /etc/nginx/certs/cocarry.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Abuse limits (reuse zones declared at the top of this file)
    limit_conn conn_perip 20;
    client_max_body_size  25m;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    keepalive_timeout     30s;

    location / {
        limit_req zone=req_general burst=60 nodelay;
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── After the CDN is confirmed on Full (strict), replace the `listen 80;`
#    line above with this redirect server to force all plain HTTP to HTTPS.
#    Do NOT enable this while the CDN is still on "Flexible" — it will cause
#    a redirect loop (CDN talks HTTP to origin, origin 301s to HTTPS, repeat).
