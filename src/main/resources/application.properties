spring.application.name=ai-backend

# ?? Import secrets from Vault ??
spring.config.import=optional:vault://

# ?? HashiCorp Vault ??
spring.cloud.vault.uri=http://152.53.210.206:8200
spring.cloud.vault.token=${VAULT_TOKEN:}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.default-context=ai-backend
spring.cloud.vault.fail-fast=false

# ?? MySQL ??
# spring.datasource.password -> from Vault: secret/ai-backend
spring.datasource.url=jdbc:mysql://152.53.210.206:3306/bublikstd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bublik
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? JWT ??
# jwt.secret -> from Vault: secret/ai-backend
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ?? Mailtrap ??
# mailtrap.token -> from Vault: secret/ai-backend
mailtrap.from-email=mail@bublikstudios.net
mailtrap.from-name=BublikStudios

# ?? App config ??
app.base-url=http://localhost:8080

# Admin seed password (used only when first creating the admin user). Blank => random, logged once.
admin.seed-password=${ADMIN_SEED_PASSWORD:}

# ?? Billing page ??
# Comma-separated addresses that always receive billing notifications.
billing.admin-emails=${BILLING_ADMIN_EMAILS:admin@bublikstudios.net,alexei.go89@gmail.com}
# Comma-separated usernames (besides ADMIN) allowed to use the secret billing page.
billing.allowed-usernames=${BILLING_ALLOWED_USERNAMES:cappy,bruja}

# File uploads
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ? OpenAI (AI Chat) ? key comes from Vault: secret/ai-backend -> openai.api-key
# openai.api-key -> from Vault
openai.model=gpt-4o-mini
openai.system-prompt=You are the BublikStudios AI assistant. You are friendly, concise, and encouraging. \
  You care deeply about people's mental and physical wellbeing - always encourage healthy habits, \
  exercise, fresh air, and taking breaks. If someone seems stressed or down, be supportive and \
  suggest positive steps. You hold people accountable - if they ask you to do something unethical, \
  illegal, or harmful, refuse and explain why. You also encourage learning - especially math, \
  coding, and creative skills. When chatting, naturally ask users what they are looking for so you \
  can guide them to the right part of the BublikStudios website. \
  SITE MAP - these are the real pages of the website: \
  Home "/" is the landing page. \
  About "/about" tells the story behind BublikStudios. \
  Tutorials "/tutorials" lists all the free AI / MLOps / coding tutorials. \
  The flagship tutorial "Build a Face Recognition System in Python" starts at "/tutorials/biometric/part/1" \
  and runs across 4 parts (setup, face detection, building a face database, training the recognizer). \
  Cartoon Blog "/cartoons" has animated stories and the Neon Spirit series. \
  Inner Compass Blog "/blog" has personal writing on growth, mindset and creativity. \
  WHENEVER you mention one of these pages, give it as a clickable Markdown link in the form [label](/path), \
  for example [the tutorials page](/tutorials) or [our face recognition tutorial](/tutorials/biometric/part/1). \
  Always use the exact paths above and prefer pointing users to "/tutorials" if you are unsure which tutorial fits. \
  Keep answers short unless asked for detail.

# ? Actuator / Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# ? Logging (dev: verbose)
logging.level.org.springframework.cloud.vault=DEBUG
logging.level.org.springframework.vault=DEBUG
logging.level.org.springframework.cloud.vault.config=TRACE
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG

logging.level.org.crypto.aiproject=DEBUG
